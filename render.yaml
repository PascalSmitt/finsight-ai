# Render Blueprint: one-click deploy from the GitHub repo (New > Blueprint)
services:
  - type: web
    name: finsight-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Optional: add ANTHROPIC_API_KEY in the Render dashboard to enable AI mode (never commit it)
